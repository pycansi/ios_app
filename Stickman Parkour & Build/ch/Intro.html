<h1>应用名称</h1>
<p>火柴人跑酷&建造</p>

<h1>介绍</h1>
<p>爽快的连招 + 无限的关卡</p>

<h2>应用说明</h2>
<p>- 丝滑操控。左半屏移动摇杆，右半屏划动操作，操作之间可形成连招。</p>
<p>- 可直接游玩内置关卡，也可自由建造关卡。</p>
<p>- 内置关卡全部由作者手工建造。编辑内置关卡可在内置关卡的基础上建造自己的关卡。</p>
<p>- 关卡可通过JSON文本导入导出。想让朋友挑战刚做好的关卡？只需要将关卡JSON文本发送过去即可。</p>
<p>- 无广告，无内购</p>
